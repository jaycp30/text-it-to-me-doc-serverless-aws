AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  RxReader — Serverless prescription reader and medication scheduler.
  Bedrock Claude reads handwritten prescriptions, creates dose schedules,
  and sends SMS/email reminders via EventBridge Scheduler + SNS/SES.

# ─── Globals ────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 120
    MemorySize: 512
    Architectures: [arm64]  # cheaper + faster than x86 for Node
    Environment:
      Variables:
        PRESCRIPTIONS_TABLE: !Ref PrescriptionsTable
        SCHEDULES_TABLE:      !Ref SchedulesTable
        IMAGES_BUCKET:        !Ref ImagesBucket
        BEDROCK_MODEL_ID:     !Ref BedrockModelId
        SCHEDULER_GROUP:      rx-medication-reminders
        SNS_TOPIC_ARN:        !Ref NotificationTopic
        APP_URL:              !Ref AppUrl
        # NOTIFIER_FUNCTION_ARN and SCHEDULER_ROLE_ARN are set per-function
        # (not here) to avoid a circular dependency on NotifyUserFunction.

# ─── Parameters ─────────────────────────────────────────────────────────────
Parameters:
  BedrockModelId:
    Type: String
    # Tokyo (ap-northeast-1) uses geo-scoped inference profiles, NOT the us. prefix.
    # jp.* keeps inference within Japan (best data residency for medical images);
    # apac.* spreads across APAC; global.* may route anywhere. Vision-capable model
    # required — processPrescription sends the prescription image to this model.
    Default: "jp.anthropic.claude-sonnet-4-6"
    Description: Bedrock model ID — must be a vision-capable profile available in your region

  SesFromEmail:
    Type: String
    Description: Verified SES sender email address (e.g. noreply@yourdomain.com)
    Default: "noreply@jaycloud.net"

  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile secret key used to protect the public /notify-test endpoint
    Default: ""

  MagicLinkSecret:
    Type: String
    NoEcho: true
    Description: Secret used to HMAC-sign session tokens embedded in email magic links. Must be at least 32 random characters.
    Default: ""

  AppUrl:
    Type: String
    Description: >
      Public URL of the frontend (Amplify URL or custom domain, no trailing slash).
      Used in email magic links and CORS rules. Override with your real URL at deploy time.
      Example: https://textit2medoc.jaycloud.net
    Default: "https://localhost:5173"

# ─── Resources ──────────────────────────────────────────────────────────────
Resources:

  # ── S3: prescription image storage ───────────────────────────────────────
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "rx-reader-images-${AWS::AccountId}"
      # Block all public access — images are sensitive medical data
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Encrypt all objects at rest with SSE-S3 (AES-256). AWS applies this by
      # default, but we declare it explicitly so the posture is auditable in IaC.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - !Ref AppUrl
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # Prescription images are write-once/read-once: processPrescription
          # reads each object exactly once during extraction, and nothing reads
          # it again afterwards (no presigned GET path exists anywhere in the
          # API). Holding them past that point is retained health data serving
          # no purpose, so they expire. 75 days leaves a wide window to re-check
          # a bad extraction against the original image.
          - Id: ExpirePrescriptionImages
            Status: Enabled
            ExpirationInDays: 75

  # ── DynamoDB: prescriptions ───────────────────────────────────────────────
  PrescriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rx-prescriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: prescriptionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: prescriptionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true  # auto-delete old records

  # ── DynamoDB: schedules ───────────────────────────────────────────────────
  SchedulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rx-schedules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: scheduleId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: scheduleId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ── SNS: SMS notifications ────────────────────────────────────────────────
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rx-notifications

  # ── EventBridge Scheduler group ───────────────────────────────────────────
  # All per-dose schedules live in this group — easy to manage/delete
  SchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: rx-medication-reminders

  # ── IAM: EventBridge Scheduler → Lambda ───────────────────────────────────
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "rx-scheduler-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeNotifyLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NotifyUserFunction.Arn

  # ── API Gateway ───────────────────────────────────────────────────────────
  RxApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      # Throttling caps abuse of this unauthenticated public API (wallet-DoS via
      # Bedrock, SES email reputation). Stage-wide default + tighter per-route
      # limits on the expensive/abusable endpoints.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        "POST /chat":         # Bedrock — most abusable (free LLM relay)
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        "POST /process":      # Bedrock vision — expensive
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        "POST /notify-test":  # SES email — reputation risk
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
        "POST /upload-url":   # mints an identity + a presigned PUT, unauthenticated
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - !Ref AppUrl
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 600

  # ── Lambda layer: the session-token auth primitive ───────────────────────
  # One implementation of HMAC signing and verification, shared by every
  # function that needs it. It used to be copy-pasted into four functions,
  # which meant a fix applied to one left the other three wrong.
  #
  # A layer rather than a shared file because SAM packages each function's
  # CodeUri on its own, so a require across function folders throws at runtime.
  # The nodejs/node_modules/<name> layout puts it on Lambda's NODE_PATH, so
  # handlers require the bare specifier "rx-session-token" — the same specifier
  # the repo resolves via the file: dependency in package.json, so tests
  # exercise the module that actually runs.
  #
  # Attach this to any function whose code — or any module it loads — requires
  # rx-session-token, even one that never signs or verifies itself: the require
  # runs at module scope, so a missing layer throws on cold start rather than at
  # deploy time. ProcessPrescriptionWorkerFunction does not currently need it
  # (shared.js stopped signing when identity moved to getUploadUrl) and keeps it
  # anyway, because it shares a CodeUri with the handler that does and the cost
  # of a layer nothing imports is zero.
  AuthLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: rx-session-token
      Description: HMAC session-token signing and verification
      ContentUri: backend/layers/auth/
      CompatibleRuntimes:
        - nodejs24.x
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete

  # ── Lambda: get presigned S3 upload URL ──────────────────────────────────
  # Frontend calls this first, uploads image directly to S3 (no Lambda proxy)
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-get-upload-url
      Handler: index.handler
      CodeUri: backend/functions/getUploadUrl/
      Layers:
        - !Ref AuthLayer
      Environment:
        Variables:
          # This function is now the ONE place an identity is minted, so it is
          # the one place outside notifyUser that needs the signing secret.
          MAGIC_LINK_SECRET: !Ref MagicLinkSecret
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
      Events:
        GetUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /upload-url
            Method: POST

  # ── Lambda: /process API handler (fast path) ──────────────────────────────
  # Validates, claims the idempotency lock, async-invokes the worker, returns
  # 202. Deliberately holds NO Bedrock, S3 or Scheduler permissions — if this
  # function ever needs them, the slow work has leaked back onto the request
  # path. See issue #5.
  ProcessPrescriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-process-prescription
      Handler: index.handler
      Layers:
        - !Ref AuthLayer
      CodeUri: backend/functions/processPrescription/
      # One DynamoDB write plus an async invoke. API Gateway gives up at 30s
      # anyway, so a larger value here would only ever be dead configuration.
      Timeout: 10
      Environment:
        Variables:
          WORKER_FUNCTION_ARN: !GetAtt ProcessPrescriptionWorkerFunction.Arn
          MAGIC_LINK_SECRET:   !Ref MagicLinkSecret
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SchedulesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessPrescriptionWorkerFunction
      Events:
        Process:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /process
            Method: POST

  # ── Lambda: prescription worker (slow path, async only) ───────────────────
  # Invoked asynchronously by ProcessPrescriptionFunction. Not wired to any
  # API route, so nothing can call it synchronously and reintroduce the 30s
  # ceiling this split exists to escape.
  ProcessPrescriptionWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-process-prescription-worker
      Handler: worker.handler
      Layers:
        - !Ref AuthLayer
      CodeUri: backend/functions/processPrescription/
      # Bedrock needs 30-60s on a busy prescription; 300s leaves generous room
      # while staying far inside Lambda's 15-minute asynchronous limit. No
      # Managed Instances and no pricing-model change are required for this.
      Timeout: 300
      MemorySize: 1024  # image decode + base64 of up to 5 pages
      Environment:
        Variables:
          NOTIFIER_FUNCTION_ARN: !GetAtt NotifyUserFunction.Arn
          SCHEDULER_ROLE_ARN:    !GetAtt SchedulerRole.Arn
          # No MAGIC_LINK_SECRET: the worker never signs a session token (the
          # API handler issues it with the 202). Keeping a secret out of a
          # function that has no use for it keeps its blast radius smaller.
      # No automatic retries. Lambda retries an async invoke twice by default,
      # and a retry after a successful Bedrock call pays for that call again —
      # Bedrock is this stack's main cost risk, which is why /process is
      # throttled to 1 rps. Failures are written to the record with a stable
      # code and surfaced to the user, who can retry deliberately.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
        - DynamoDBWritePolicy:
            TableName: !Ref PrescriptionsTable
        - DynamoDBWritePolicy:
            TableName: !Ref SchedulesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
                - iam:PassRole
              Resource: "*"
        # Invoke NotifyUser directly to send the subscription confirmation email
        # server-side (instead of the browser calling the public /notify-test).
        - LambdaInvokePolicy:
            FunctionName: !Ref NotifyUserFunction

  # ── Lambda: send notification (SMS or email) ──────────────────────────────
  # Invoked by EventBridge Scheduler (Option A — per-dose)
  NotifyUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-notify-user
      Handler: index.handler
      Layers:
        - !Ref AuthLayer
      CodeUri: backend/functions/notifyUser/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"  # needed for direct SMS (no topic)
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Environment:
        Variables:
          SES_FROM_EMAIL:       !Ref SesFromEmail
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          MAGIC_LINK_SECRET:    !Ref MagicLinkSecret
      Events:
        TestNotification:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /notify-test
            Method: POST

  # ── Lambda: daily morning summary ─────────────────────────────────────────
  # Option B — scans all active schedules, sends "today's meds" summary
  # Runs every hour so we can handle multiple timezones cleanly
  DailySummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-daily-summary
      Handler: index.handler
      CodeUri: backend/functions/dailySummary/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
        - LambdaInvokePolicy:
            FunctionName: !Ref NotifyUserFunction
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Environment:
        Variables:
          SES_FROM_EMAIL: !Ref SesFromEmail
          NOTIFIER_FUNCTION_ARN: !GetAtt NotifyUserFunction.Arn
      Events:
        # Runs every hour — Lambda checks if it's 8am in the user's timezone
        HourlyCron:
          Type: Schedule
          Properties:
            Schedule: "rate(1 hour)"
            Enabled: true

  # ── Lambda: cancel all upcoming reminders for a user ─────────────────────
  # DELETE /reminders/{userId} — deletes EventBridge rules + marks DynamoDB inactive
  CancelRemindersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-cancel-reminders
      Handler: index.handler
      Layers:
        - !Ref AuthLayer
      CodeUri: backend/functions/cancelReminders/
      Environment:
        Variables:
          MAGIC_LINK_SECRET: !Ref MagicLinkSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
        - DynamoDBWritePolicy:
            TableName: !Ref SchedulesTable
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
                - scheduler:ListSchedules
              Resource: "*"
      Events:
        Cancel:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /reminders/{userId}
            Method: DELETE

  # ── Lambda: get user's active schedules ───────────────────────────────────
  GetSchedulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-get-schedules
      Handler: index.handler
      Layers:
        - !Ref AuthLayer
      CodeUri: backend/functions/getSchedules/
      Environment:
        Variables:
          MAGIC_LINK_SECRET: !Ref MagicLinkSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchedulesTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /schedules
            Method: GET

  # ── Lambda: AI chat about the prescription ────────────────────────────────
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rx-chat
      Handler: index.handler
      CodeUri: backend/functions/chat/
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref RxApi
            Path: /chat
            Method: POST

  # ── CloudWatch log groups ─────────────────────────────────────────────────
  # Declared explicitly purely to set retention. Left alone, Lambda creates
  # each group on first invocation with "Never Expire" — which is how logs
  # quietly become the longest-lived copy of the most sensitive data in the
  # system, outliving both the DynamoDB TTL and the S3 expiry above.
  #
  # 30 days is an operational window, not a user-data one: the handlers no
  # longer log contact details or medication data (see the same PR), so what
  # remains here is diagnostics.
  #
  # DEPLOY NOTE: CloudFormation cannot adopt a log group that already exists.
  # On a stack that has already run, the auto-created /aws/lambda/rx-* groups
  # must be deleted before this deploys — see DEPLOY.md, "One-time migration".
  GetUploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-get-upload-url
      RetentionInDays: 30

  ProcessPrescriptionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-process-prescription
      RetentionInDays: 30

  ProcessPrescriptionWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-process-prescription-worker
      RetentionInDays: 30

  NotifyUserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-notify-user
      RetentionInDays: 30

  DailySummaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-daily-summary
      RetentionInDays: 30

  CancelRemindersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-cancel-reminders
      RetentionInDays: 30

  GetSchedulesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-get-schedules
      RetentionInDays: 30

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/rx-chat
      RetentionInDays: 30

# ─── Outputs ────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway endpoint — put this in your Amplify environment variables
    Value: !Sub "https://${RxApi}.execute-api.${AWS::Region}.amazonaws.com/v1"

  ImagesBucketName:
    Value: !Ref ImagesBucket

  NotificationTopicArn:
    Value: !Ref NotificationTopic

  SchedulerGroupName:
    Value: !Ref SchedulerGroup
